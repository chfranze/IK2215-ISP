frr version 9.1.3
frr defaults traditional
hostname as114r4
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 description client lan
 ip address 1.114.100.1/24
exit
!
interface eth1
 description r1
 ip address 1.114.0.5/31
exit
!
interface eth2
 description r3
 ip address 1.114.0.6/31
exit
!
interface lo
 description dummy0
 ip address 1.114.2.4/32
exit
!
router ospf
 network 1.114.0.4/31 area 0.0.0.0
 network 1.114.0.6/31 area 0.0.0.0
 network 1.114.2.4/32 area 0.0.0.0
 network 1.114.100.0/24 area 0.0.0.0
exit
!
