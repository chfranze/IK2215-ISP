frr version 9.1.3
frr defaults traditional
hostname as114r2
no ipv6 forwarding
service integrated-vtysh-config
!
interface dummy0
 description dummy0
 ip address 1.114.2.2/32
exit
!
interface eth0
 description AS21
 ip address 2.21.0.1/31
exit
!
interface eth1
 description r1
 ip address 1.114.0.1/31
exit
!
interface eth2
 description r3
 ip address 1.114.0.8/31
 ip ospf cost 70
exit
!
router bgp 114
 bgp router-id 1.114.2.2
 no bgp ebgp-requires-policy
 neighbor 1.114.2.1 remote-as 114
 neighbor 1.114.2.1 description r1
 neighbor 1.114.2.1 update-source 1.114.2.2
 neighbor 2.21.0.0 remote-as 21
 neighbor 2.21.0.0 description AS21
 !
 address-family ipv4 unicast
  network 1.114.1.0/24
  network 1.114.10.0/24
  aggregate-address 1.114.0.0/20 summary-only
  neighbor 1.114.2.1 next-hop-self
  neighbor 1.114.2.1 soft-reconfiguration inbound
  neighbor 2.21.0.0 soft-reconfiguration inbound
  neighbor 2.21.0.0 route-map PREF-AS21-IN in
  neighbor 2.21.0.0 route-map OUT-TO-AS21 out
 exit-address-family
exit
!
router ospf
 ospf router-id 1.114.2.2
 redistribute bgp route-map AS21-PREFIX
 network 1.114.0.0/31 area 0.0.0.0
 network 1.114.0.8/31 area 0.0.0.0
 network 1.114.2.2/32 area 0.0.0.0
 default-information originate always metric 100
exit
!
ip prefix-list OUR-AGG seq 5 permit 1.114.0.0/20
ip prefix-list AS21-PREFIXES seq 5 permit 2.21.0.0/20
!
route-map PREF-AS21-IN permit 10
 match ip address prefix-list AS21-PREFIXES
 set local-preference 300
exit
!
route-map PREF-AS21-IN permit 20
exit
!
route-map OUT-TO-AS21 permit 10
 match ip address prefix-list OUR-AGG
 set as-path prepend 114 114 114
 set community 114:200 additive
exit
!
route-map OUT-TO-AS21 permit 20
 match ip address prefix-list AS1-PREFIXES
 set as-path prepend 114 114 114
 set community 114:300 additive
exit
!
route-map AS21-PREFIX permit 10
 match ip address prefix-list AS21-PREFIXES
exit
!
