frr version 9.1.3
frr defaults traditional
hostname as114r2
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 description AS21
 ip address 2.21.0.1/31
exit
!
interface eth1
 description r1
 ip address 1.114.0.1/31
exit
!
interface eth2
 description r3
 ip address 1.114.0.8/31
exit
!
interface lo
 description dummy0
 ip address 1.114.2.2/32
exit
!
router ospf
 network 1.114.0.0/31 area 0.0.0.0
 network 1.114.0.8/31 area 0.0.0.0
 network 1.114.222.2/32 area 0.0.0.0
exit
!
