frr version 9.1.3
frr defaults traditional
hostname as114r1
no ipv6 forwarding
service integrated-vtysh-config
!
interface eth0
 description AS1
 ip address 1.0.0.5/31
exit
!
interface eth1
 description r2
 ip address 1.114.0.0/31
exit
!
interface eth2
 description r3
 ip address 1.114.0.2/31
exit
!
interface eth3
 description r4
 ip address 1.114.0.4/31
exit
!
interface lo
 description dummy0
 ip address 1.114.2.1/32
exit
!
router ospf
 network 1.114.0.0/31 area 0.0.0.0
 network 1.114.0.2/31 area 0.0.0.0
 network 1.114.0.4/31 area 0.0.0.0
 network 1.114.2.1/32 area 0.0.0.0
exit
!
