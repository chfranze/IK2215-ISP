frr version 9.1.3
frr defaults traditional
hostname as114r1
no ipv6 forwarding
service integrated-vtysh-config
!
interface dummy0
 description dummy0
 ip address 1.114.2.1/32
exit
!
interface eth0
 description AS1
 ip address 1.0.0.5/31
exit
!
interface eth1
 description r2
 ip address 1.114.0.0/31
 ip ospf cost 100
exit
!
interface eth2
 description r3
 ip address 1.114.0.2/31
 ip ospf cost 50
exit
!
interface eth3
 description r4
 ip address 1.114.0.4/31
exit
!
router bgp 114
 bgp router-id 1.114.2.1
 neighbor 1.0.0.4 remote-as 1
 neighbor 1.0.0.4 description AS1
 neighbor 1.114.2.2 remote-as 114
 neighbor 1.114.2.2 description r2
 neighbor 1.114.2.2 update-source 1.114.2.1
 !
 address-family ipv4 unicast
  network 1.114.0.0/20
  neighbor 1.0.0.4 route-map PREF-AS1-IN in
  neighbor 1.0.0.4 route-map OUT-TO-AS1 out
  neighbor 1.114.2.2 next-hop-self
 exit-address-family
exit
!
router ospf
 ospf router-id 1.114.2.1
 network 1.114.0.0/31 area 0.0.0.0
 network 1.114.0.2/31 area 0.0.0.0
 network 1.114.0.4/31 area 0.0.0.0
 network 1.114.2.1/32 area 0.0.0.0
 default-information originate always
exit
!
ip prefix-list OUR-AGG seq 5 permit 1.114.0.0/20
!
route-map PREF-AS1-IN permit 10
 set local-preference 200
exit
!
route-map OUT-TO-AS1 permit 10
 match ip address prefix-list OUR-AGG
exit
!
