frr version 9.1.3
frr defaults traditional
hostname as114r3
no ipv6 forwarding
service integrated-vtysh-config
!
interface dummy0
 description dummy0
 ip address 1.114.2.3/32
exit
!
interface eth0
 description server lan
 ip address 1.114.1.1/24
 ip ospf passive
exit
!
interface eth1
 description r4
 ip address 1.114.0.7/31
exit
!
interface eth2
 description r1
 ip address 1.114.0.9/31
 ip ospf cost 50
exit
!
interface eth3
 description r2
 ip address 1.114.0.9/31
exit
!
router ospf
 ospf router-id 1.114.2.3
 network 1.114.0.2/31 area 0.0.0.0
 network 1.114.0.6/31 area 0.0.0.0
 network 1.114.0.8/31 area 0.0.0.0
 network 1.114.1.0/24 area 0.0.0.0
 network 1.114.2.3/32 area 0.0.0.0
exit
!
